# nfpm (https://nfpm.goreleaser.com) -- deb, rpm and apk from the files
# `make dist` already produces. Nothing is built here: the module in the
# package is the one from the release tarball for the same target, so a
# package and its tarball are the same bytes on two roads to the host.
#
# Every ${VAR} is set by packaging/package.sh from the tarball's BUILDINFO
# and the target name; that script is where the formats and the module
# directory per distribution are decided. What each format calls the
# libraries the module needs is here, per packager, because that is where
# someone packaging by hand would look for it.
name: pam-ssoossh
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
prerelease: ${PKG_PRERELEASE}
version_schema: semver
section: admin
priority: optional
maintainer: ${PKG_MAINTAINER}
vendor: ${PKG_MAINTAINER}
homepage: ${PKG_HOMEPAGE}
license: MIT
description: |
  PAM module authenticating against ssoosshd.
  Loads into sudo, sshd and login; links the operating system's own
  libcrypto, libcurl and libpam and ships no crypto of its own.
  Built for ${PKG_TARGET} and qualified against ssoosshd ${PKG_COMPAT}:
  see /usr/share/doc/pam-ssoossh/BUILDINFO.

# Sources are relative to the staging directory package.sh unpacks the
# tarball into and runs nfpm from. @SECURITYDIR@ is substituted by that
# script before nfpm reads this file, because the module directory differs
# per format and nfpm expands no variables in destinations. Every entry is
# a file with an explicit mode: a `type: tree` entry would be shorter, but
# nfpm 2.47 writes tree modes apk-tools rejects (goreleaser/nfpm#1112).
contents:
  - src: pam_ssoossh.so
    dst: @SECURITYDIR@/pam_ssoossh.so
    file_info:
      # @MODULE_MODE@ too, because the distributions disagree and the
      # neighbours are what an auditor compares against: RHEL and Alpine
      # ship their PAM modules 0755, Debian ships them 0644. dlopen needs
      # read and not execute, so this is convention rather than function --
      # but being the one file in /usr/lib64/security with a different mode
      # is what a scanner reports.
      mode: @MODULE_MODE@
  - src: man/*.8.gz
    dst: /usr/share/man/man8/
    file_info:
      mode: 0644
  - src: man/*.5.gz
    dst: /usr/share/man/man5/
    file_info:
      mode: 0644
  - src: examples/pam.d/*
    dst: /usr/share/doc/pam-ssoossh/examples/pam.d/
    file_info:
      mode: 0644
  - src: examples/*.yaml
    dst: /usr/share/doc/pam-ssoossh/examples/
    file_info:
      mode: 0644
  - src: examples/README
    dst: /usr/share/doc/pam-ssoossh/examples/README
    file_info:
      mode: 0644
  # Debian's pam-auth-update profile, installed where pam-auth-update
  # looks for it and deliberately never enabled: no postinst runs
  # pam-auth-update, and the profile carries "Default: no" so a run
  # triggered by some other package leaves it off.
  #
  # It is not enabled for the deployer because pam-auth-update writes into
  # common-auth, which screen lockers, display managers and polkit read --
  # and an approval prompt nobody can see is a lock-out. The profile's
  # Name field carries that warning into pam-auth-update's own menu, which
  # is the only place the person turning it on is certain to look.
  - src: examples/pam-configs/ssoossh
    dst: /usr/share/pam-configs/ssoossh
    packager: deb
    file_info:
      mode: 0644
  - src: examples/pam-configs/README
    dst: /usr/share/doc/pam-ssoossh/examples/pam-configs/README
    packager: deb
    file_info:
      mode: 0644
  - src: BUILDINFO
    dst: /usr/share/doc/pam-ssoossh/BUILDINFO
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/pam-ssoossh/LICENSE
    file_info:
      mode: 0644
  # Debian wants the licence under this name too.
  - src: LICENSE
    dst: /usr/share/doc/pam-ssoossh/copyright
    packager: deb
    file_info:
      mode: 0644

# The dependencies are the sonames the module links -- what rpmbuild and
# abuild would derive themselves -- wherever the format can express that.
# Debian cannot, so there it is package names, with both spellings of the
# ones the 64-bit time_t transition renamed on Debian 13 and Ubuntu 24.04.
# PKG_CRYPTO_SO is libcrypto.so.3 or libcrypto.so.1.1 by target.
overrides:
  deb:
    depends:
      - libpam0g
      - ${PKG_DEB_CRYPTO}
      - libcurl4t64 | libcurl4
      - libc6 (>= 2.34)
  rpm:
    depends:
      # Sonames only, deliberately no `pam`. The module dlopens libpam and
      # needs nothing else from that package -- no helper binary, no
      # pam.d file of its own -- so the soname below is the whole
      # requirement, and it is satisfied on every EL major: by pam on 8 and
      # 9, by pam-libs on 10, where PAM was split. Requiring `pam` by name
      # was free on 8 and 9, whose base images carry it, and pulled pam,
      # cracklib, cracklib-dicts, gdbm and libpwquality onto an EL 10 host
      # that needed none of them.
      - ${PKG_CRYPTO_SO}()(64bit)
      - libcurl.so.4()(64bit)
      - libpam.so.0()(64bit)
  apk:
    depends:
      - linux-pam
      - so:${PKG_CRYPTO_SO}
      - so:libcurl.so.4
      - so:libpam.so.0

# Signing. An empty key_file means unsigned, which is what a local build
# gets; the release workflow supplies the keys from repository secrets.
# deb and rpm take the OpenPGP key. apk does not: Alpine signs with a bare
# RSA key whose public half a host installs as /etc/apk/keys/<key_name>.rsa.pub
# -- nfpm adds that suffix itself, and expands no variables here, so the
# name is a literal and packaging/README.md repeats it.
deb:
  signature:
    key_file: ${PKG_GPG_KEY_FILE}
    type: origin
rpm:
  summary: PAM module authenticating against ssoosshd
  group: System Environment/Base
  signature:
    key_file: ${PKG_GPG_KEY_FILE}
apk:
  signature:
    key_file: ${PKG_APK_KEY_FILE}
    key_name: pam-ssoossh
