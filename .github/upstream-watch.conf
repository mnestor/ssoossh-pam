# What .github/scripts/upstream-watch.sh watches. The script's header says
# what each kind of entry means and what is checked for it.
#
# Not listed, on purpose:
#   * libpam, libcrypto and libcurl. They are the operating system's, linked
#     at run time, and patched by the host's own updates, not by this tree.
#   * The CI container tags and FreeBSD versions. They name deployment
#     targets, so moving one is a support decision and not an update.
#   * The GitHub Actions and devcontainer features, which Dependabot covers
#     (see .github/dependabot.yml).

# vendored <name> <owner/repo> <local dir> <upstream dir> <file>...
vendored jsmn zserge/jsmn third_party/jsmn . jsmn.h
vendored qrcodegen nayuki/QR-Code-generator third_party/qrcodegen c qrcodegen.c qrcodegen.h

# arg <name> <owner/repo> <file> <ARG name>
arg actionlint rhysd/actionlint .devcontainer/Dockerfile ACTIONLINT_VERSION
arg act nektos/act .devcontainer/Dockerfile ACT_VERSION
