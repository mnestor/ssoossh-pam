name: CI

# Every platform a release ships, on every push and pull request: Linux,
# FreeBSD 14 and 15, and macOS on both the release runner and the deployment
# floor.
#
# FreeBSD and macOS used to wait for the tag. v1.4.0 is why they do not:
# its new e2e scenarios passed on every Linux row here, then failed on the
# release's macOS job, because `log stream` hands a backslash back as \134
# and Linux has nothing that does. The module was right and the harness was
# not, and nothing short of running the suite on macOS could have said so.
# A platform that ships is a platform a pull request has to pass.
#
# To get the same answer for a branch with no pull request yet:
#
#   gh workflow run ci.yml --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build dependencies, once per image family. A matrix row names its family
# and the install step looks the command up here.
#
# ca-certificates is a dependency of the checkout, not of the build: the
# debian image ships no trust store, so git over https cannot verify
# github.com and actions/checkout fails before anything is compiled. The
# el and alpine images already carry one.
env:
  INSTALL_debian: apt-get update && apt-get install -y --no-install-recommends
    ca-certificates build-essential pkg-config libssl-dev
    libcurl4-openssl-dev libpam0g-dev libpam-runtime libpam-modules git
    openssh-client python3
  INSTALL_alpine: apk add --no-cache build-base pkgconf openssl-dev curl-dev
    linux-pam-dev linux-pam git compiler-rt openssh-keygen python3 bash
  INSTALL_el: dnf install -y gcc make pkgconf-pkg-config openssl-devel
    libcurl-devel pam pam-devel git libasan libubsan openssh-clients python3

jobs:
  # Three Linux images rather than a libc pair, because the third one is not
  # about libc at all: el8 is the only build that compiles the OpenSSL 1.1.1
  # and curl_multi_wait paths. Without it the version floor is an assertion
  # in a document.
  #
  # AlmaLinux rather than Red Hat's own ubi8: pam-devel is not in the
  # unentitled UBI repositories (its CodeReady Builder subset does not carry
  # it), so a UBI job cannot build this module at all. AlmaLinux 8 is the
  # same RHEL 8 ABI and ships the same versions -- verified locally as
  # gcc 8.5.0, openssl-devel 1.1.1k, curl 7.61.1.
  linux:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian12          # OpenSSL 3.0, curl 7.88, gcc 14
            container: debian:12
            family: debian
          - name: alpine            # musl, OpenSSL 3.5, gcc 15
            container: alpine:3
            family: alpine
          - name: el8               # OpenSSL 1.1.1k, curl 7.61.1, gcc 8.5 -- the floor
            container: almalinux:8
            family: el
          - name: el9               # OpenSSL 3.x with a FIPS provider, gcc 11
            container: almalinux:9
            family: el
          # The same two, with OpenSSL forced into FIPS mode the way Red
          # Hat's build allows without a fips=1 kernel. el8's FIPS module
          # has no EdDSA, so this is where the Ed25519 probe must say no and
          # the ECDSA-only path must carry the whole flow; el9's does, so
          # there everything must still work.
          - name: el8-fips
            container: almalinux:8
            family: el
            fips: 1
          - name: el9-fips
            container: almalinux:9
            family: el
            fips: 1
    steps:
      - name: Install build dependencies
        run: ${{ env[format('INSTALL_{0}', matrix.family)] }}

      # Set only for the FIPS rows: Red Hat's OpenSSL honours the variable
      # by presence, so an empty value would force FIPS on every row.
      - name: Force OpenSSL into FIPS mode
        if: ${{ matrix.fips }}
        run: |
          echo "OPENSSL_FORCE_FIPS_MODE=1" >> "$GITHUB_ENV"
          OPENSSL_FORCE_FIPS_MODE=1 openssl md5 /dev/null 2>&1 | tail -1

      - uses: actions/checkout@v7

      # The version string comes from `git describe`, and a checkout owned by
      # a different uid than the container user makes git refuse to read it.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Report the toolchain under test
        run: |
          cc --version | head -1
          pkg-config --modversion libcrypto || true
          pkg-config --modversion libcurl || true
          echo "OPENSSL_FORCE_FIPS_MODE=${OPENSSL_FORCE_FIPS_MODE:-unset}"

      - name: Build
        run: make

      - name: Symbol, load and unit gates
        run: make test

      # Nothing in the module may write to stdout or stderr: it lives inside
      # sudo and sshd, where both streams belong to the host process.
      # Dropping debug=stdout removed the only path that ever deliberately
      # broke that rule, so this can be an unconditional failure rather than
      # one with an exemption in it.
      - name: No stdio in the module
        run: make check-stdio

      # A regression here usually means something got statically linked that
      # should not have been.
      - name: Size gate
        run: make check-size

      # The whole flow against a stub ssoosshd: create, the events stream,
      # the reconnect, the deadline, and the four checks against a
      # certificate ssh-keygen minted a moment earlier. Runs as root, which
      # inside a job container it already is.
      #
      # Before the sanitiser build rather than after: `make san` leaves an
      # instrumented module behind, and an instrumented module dlopened by
      # an uninstrumented harness aborts on load. `make e2e` detects that
      # and rebuilds, but not paying for the rebuild is better.
      - name: End to end against a stub server
        run: make e2e

      - name: Sanitiser build and unit suite
        run: make san

  # The parsers that touch bytes a network peer chose. A short run per
  # target on every commit; a long one is a nightly's job, not a push's.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates build-essential clang libclang-rt-dev \
            pkg-config libssl-dev libcurl4-openssl-dev libpam0g-dev git \
            openssh-client

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fuzz every parser
        run: make fuzz-run FUZZ_RUNS=200000

  # No hosted FreeBSD image exists, so it runs in a VM on the Linux runner.
  # Slower than native, but it is the OpenPAM platform that reaches server
  # hosts, so it matters more than macOS does.
  #
  # Both supported majors, because they are two platforms wearing one name:
  # base OpenSSL is 3.0 on 14 and 3.5 on 15, so they link different
  # libcrypto sonames and release.yml ships an artifact for each. A green
  # 14 says nothing about 15.
  freebsd:
    name: freebsd${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: '14'
            version: '14.4'
          - major: '15'
            version: '15.1'
    steps:
      - uses: actions/checkout@v7

      - uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          version: ${{ matrix.version }}
          # One script rather than several steps: each `run` is a fresh VM
          # session, so state does not carry between them. -e because the
          # job's result is this script's status, and without it that is
          # only the status of the last line.
          run: |
            set -ex

            # The image's package set is older than the repo, and pkg is
            # content to install a curl built against a newer libssh2 than
            # the one already on disk -- libcurl.so.4 then fails to resolve
            # at dlopen time. Bring the image up to the repo first.
            sudo pkg upgrade -y

            # libcurl is NOT in FreeBSD base -- base has fetch(1), not curl.
            # libpam and OpenSSL are. bash and python3 are for the e2e
            # harness; ssh-keygen is in base.
            sudo pkg install -y gmake pkgconf curl bash python3

            uname -a
            cc --version | head -1
            pkg-config --modversion libcrypto || true
            pkg-config --modversion libcurl || true

            # OpenPAM, not Linux-PAM. If either header is missing the whole
            # platform assumption is wrong and everything below is noise.
            ls -l /usr/include/security/pam_appl.h
            ls -l /usr/include/security/openpam.h

            gmake
            gmake test
            gmake check-stdio
            gmake check-size
            gmake san

            # This image boots with kern.hostname empty, so gethostname(3)
            # succeeds and returns nothing, the module sends no "hostname"
            # claim and context_check.py, rightly, fails the request body.
            # Name it.
            sudo hostname freebsd-ci

            # Last, because it runs as root: anything it leaves in the tree
            # is root's, and `gmake san` starts with a clean. It rebuilds
            # the module plain itself, since san left an instrumented one.
            # syslogd runs by default here and files LOG_AUTHPRIV into
            # /var/log/auth.log.
            gmake tests/pamtest
            sudo gmake e2e

  # Two runners, because the release splits the question in two: it builds
  # on macOS 26 for a deployment floor of 15. macos-26 is the runner the
  # release job itself uses, so a green row here is the release's macOS
  # gates passing before the tag rather than after it; macos-15 is where
  # the module is actually loaded and run on the oldest release it claims.
  #
  # src/crypto_darwin.c is compiled nowhere else -- the Makefile builds
  # exactly one crypto backend -- so this job is the only check an edit to
  # it gets. Console mode is not compiled into the macOS build.
  macos:
    name: macos (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: What this SDK actually has
        run: |
          sw_vers
          uname -m
          cc --version | head -1
          sdk=$(xcrun --show-sdk-path)
          echo "SDK: $sdk"

          # libcurl is a system library here, headers and stub included --
          # if that stops being true, the HTTP half needs another route.
          if [ -f "$sdk/usr/include/curl/curl.h" ]; then
            echo "curl headers: present"
          else
            echo "curl headers: ABSENT"
            exit 1
          fi

          # No OpenSSL, which is why there is a Security.framework backend
          # at all. If Apple ever ships headers, the decision is worth
          # revisiting rather than assuming.
          if [ -d "$sdk/usr/include/openssl" ]; then
            echo "openssl headers: PRESENT -- the macOS crypto decision needs revisiting"
          else
            echo "openssl headers: absent, as expected"
          fi

          # OpenPAM, and the module directory that SIP protects.
          ls -l "$sdk/usr/include/security/pam_appl.h"
          ls -l "$sdk/usr/include/security/openpam.h"

      # The Ed25519 SPI the Darwin backend resolves at runtime, checked in
      # this SDK's export list before anything is built. A missing symbol
      # here is the earliest possible warning that a macOS is about to
      # lose ssh-ed25519 CAs -- see docs/porting.md, and apple-drift.yml
      # for the same check across every SDK and beta on a schedule.
      - name: Ed25519 SPI still exported by this SDK
        run: tests/apple-spi-check.sh --sdk "$(xcrun --show-sdk-path)"

      - name: Build
        run: make

      - name: Symbol, load and unit gates
        run: make test

      # The other half of the SPI check: through the framework this macOS
      # actually runs, via the backend's own self-test and the pinned
      # acceptance profile in tests/unit/ed25519_test.c.
      - name: Ed25519 SPI works on this macOS
        run: make check-apple-spi

      - name: No stdio in the module
        run: make check-stdio

      - name: Size gate
        run: make check-size

      - name: Sanitiser build and unit suite
        run: make san

      # Last, and after san rather than before it as on Linux: this is the
      # one step that runs as root, so anything it leaves in the tree is
      # root's, and `make san` starts with a clean. `make e2e` sees the
      # instrumented module san left and rebuilds it plain.
      #
      # /usr/lib/pam is protected by System Integrity Protection, so
      # tests/e2e.sh loads the bundle by absolute path, and it reads the
      # log through `log stream`: syslog(3) feeds the unified logging
      # system on macOS and there is no socket to bind.
      - name: End to end against a stub server
        run: |
          make tests/pamtest
          sudo make e2e
