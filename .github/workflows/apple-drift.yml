name: Apple drift

# Does Apple still export the Ed25519 SPI the macOS backend depends on, and
# does it still behave? Asked of every macOS and every Xcode SDK GitHub
# hosts -- betas and previews included -- on a schedule, so the answer
# changes here before it changes on a host.
#
# Why this exists: src/crypto_darwin.c verifies ssh-ed25519 through
# kSecAttrKeyTypeEd25519 and kSecKeyAlgorithmEdDSASignatureMessageCurve25519SHA512,
# which Security.framework has exported since macOS 14 without ever
# declaring in a public header. The backend resolves them with dlsym and
# self-tests them, so a host where they vanish degrades to "ssh-ed25519
# unsupported" rather than breaking. Degrading across a fleet is still
# something to know about a beta cycle early, not a point release late.
# docs/porting.md has the full story.
#
# Two jobs. `hosted` runs on every macOS image GitHub offers -- the two
# newest and the preview -- and does both views in one VM: every Xcode
# SDK on the image, betas included, so the SDK for the *next* macOS is
# checked while it is still a beta; then the module built and its Ed25519
# suite run through the framework of the macOS the image runs. `source`
# reads Apple's open-source drop of Security.framework for the
# declarations and the export list; it lags releases, but it is the one
# view that says *why* something changed.
#
# A third, for an Apple developer account: a self-hosted Mac enrolled in
# the developer beta programme runs the runtime check against the beta OS
# itself, which no hosted image does. Gated on a repository variable so a
# repo without such a Mac does not queue forever -- see docs/porting.md,
# "Watching Apple" for the setup.
#
# Failure notifications for scheduled runs go to the author of the last
# commit that touched this file. Keep that someone who reads them.
on:
  schedule:
    # Mondays, 06:00 UTC. Apple's betas land on their own cadence; weekly
    # is early enough for a cycle that runs months.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    name: hosted (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The two newest stable images and the preview one. GitHub's labels
        # for these move with each Xcode cycle: when a row starts failing
        # with "no runner matched", update it from
        # https://github.com/actions/runner-images#available-images
        runner: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: What this image is
        run: sw_vers

      # The module and the unit binary the runtime half of the check runs.
      - name: Build
        run: make tests/unit_tests

      - name: Every Xcode SDK on this image, then the framework it runs
        run: tests/apple-spi-check.sh --all-xcodes

  # Apple's source drop, so a change has a diff to read. The newest tag of
  # the Security project is found from the distribution manifest, which
  # maps a macOS release to its component versions.
  source:
    name: source (apple-oss-distributions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Newest Security.framework source Apple has published
        run: |
          set -eu
          # git rather than the GitHub API: no token, no rate limit, no
          # pagination, and it runs the same under nektos/act.
          tag=$(git ls-remote --tags --refs \
                  https://github.com/apple-oss-distributions/Security \
                  'refs/tags/Security-*' \
                | sed 's|.*refs/tags/||' | sort -t- -k2,2V | tail -1)
          if [ -z "$tag" ]; then
            echo "could not list Apple's Security tags"
            exit 1
          fi
          echo "newest tag: $tag"
          base="https://raw.githubusercontent.com/apple-oss-distributions/Security/$tag"
          rc=0
          fetch() { curl -fsSL "$base/$1" -o "$(basename "$1")"; }
          fetch keychain/headers/SecItemPriv.h
          fetch keychain/headers/SecKeyPriv.h
          fetch OSX/sec/Security/SecExports.exp-in
          for want in 'SecItemPriv.h kSecAttrKeyTypeEd25519' \
                      'SecKeyPriv.h kSecKeyAlgorithmEdDSASignatureMessageCurve25519SHA512' \
                      'SecExports.exp-in _kSecAttrKeyTypeEd25519' \
                      'SecExports.exp-in _kSecKeyAlgorithmEdDSASignatureMessageCurve25519SHA512'; do
            # shellcheck disable=SC2086  # the split is the point
            set -- $want
            if grep -qw -- "$2" "$1"; then
              echo "present: $2 in $1"
            else
              echo "MISSING: $2 in $1"
              rc=1
            fi
          done
          # The availability annotation, so a deprecation shows up as a
          # diff in the log rather than as a surprise.
          grep -n -A1 'kSecAttrKeyTypeEd25519' SecItemPriv.h || true
          grep -n -A1 'kSecKeyAlgorithmEdDSASignatureMessageCurve25519SHA512' SecKeyPriv.h || true
          exit $rc

  # A Mac of your own, enrolled in the developer beta. Set the repository
  # variable SSOOSSH_APPLE_BETA_RUNNER to "true" once a self-hosted runner
  # with the labels below exists; until then this job is skipped rather
  # than queued.
  beta-runtime:
    name: runtime (developer beta, self-hosted)
    if: ${{ vars.SSOOSSH_APPLE_BETA_RUNNER == 'true' }}
    runs-on: [self-hosted, macOS, apple-beta]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: What this Mac is running
        run: sw_vers

      - name: Build
        run: make tests/unit_tests

      - name: Every Xcode SDK on this Mac, then the beta framework
        run: tests/apple-spi-check.sh --all-xcodes
