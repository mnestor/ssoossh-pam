name: Release

# Builds every artifact the README says ships, gates each one the way CI
# does, wraps the Linux ones as deb, rpm and apk and the macOS one as a
# signed installer package, and publishes the lot as one GitHub release
# with checksums and build provenance.
#
# Plain actions, nfpm and `gh`, not goreleaser: goreleaser is built around
# producing the binaries itself, which for C means either a paid "prebuilt"
# mode or fighting the tool, and the part of it that is useful here -- nfpm
# -- is a standalone binary. Everything specific to this project lives in
# `make dist`, tests/dist-target.sh and packaging/, so this file is only a
# matrix, an upload, a download, a loop and a `gh release create`.
#
# The artifact names carry what decides whether the module will load on a
# host, because it links the host's libraries rather than shipping them:
#
#   linux-x86_64-glibc-openssl3     RHEL 9+, Debian 12+, Ubuntu 22.04+ ...
#   linux-x86_64-glibc-openssl1.1   RHEL 8 and its rebuilds
#   linux-x86_64-musl               Alpine
#   freebsd14-x86_64                FreeBSD 14
#   macos15-aarch64                 macOS 15 and later, Apple silicon
#
# and aarch64 for each Linux row. The glibc rows are built on the *oldest*
# glibc that carries that OpenSSL -- AlmaLinux 9 for OpenSSL 3, AlmaLinux 8
# for 1.1.1 -- because glibc symbol versions only go forward: a module
# built on an older glibc loads on a newer one, never the reverse.
#
#   git tag v1.2.0 && git push origin v1.2.0     builds and publishes
#   gh workflow run release.yml                  builds only; the merged set
#                                                is a workflow artifact
#
# A tag with a hyphen (v1.2.0-rc1) is published as a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Build dependencies, once per image family. A matrix row names its family
# and the install step looks the command up here; the musl job, which
# starts its own container, passes INSTALL_alpine into it.
env:
  INSTALL_el: dnf install -y gcc make pkgconf-pkg-config openssl-devel
    libcurl-devel pam pam-devel git binutils openssh-clients python3
  INSTALL_alpine: apk add --no-cache build-base pkgconf openssl-dev curl-dev
    linux-pam-dev linux-pam git openssh-keygen python3 bash tar

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AlmaLinux rather than ubi: pam-devel is not in the unentitled
          # UBI repositories. Same ABI, same versions -- see ci.yml.
          - target: linux-x86_64-glibc-openssl3
            runner: ubuntu-latest
            container: almalinux:9
            family: el
          - target: linux-aarch64-glibc-openssl3
            runner: ubuntu-24.04-arm
            container: almalinux:9
            family: el
          - target: linux-x86_64-glibc-openssl1.1
            runner: ubuntu-latest
            container: almalinux:8
            family: el
          - target: linux-aarch64-glibc-openssl1.1
            runner: ubuntu-24.04-arm
            container: almalinux:8
            family: el
    steps:
      - name: Install build dependencies
        run: ${{ env[format('INSTALL_{0}', matrix.family)] }}

      # Full history and tags, so `git describe` names the release rather
      # than a bare commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image must be what the matrix row says it is. A base image
      # that starts shipping a different OpenSSL would otherwise produce a
      # mislabelled artifact that loads on nobody's host.
      - name: The image matches the target name
        run: |
          got=$(tests/dist-target.sh)
          echo "image reports: $got"
          test "$got" = "${{ matrix.target }}"

      - name: Build
        run: make

      # The same gates ci.yml runs, because a release is not the place to
      # trust that main was green.
      - name: Symbol, load and unit gates
        run: make test

      - name: No stdio in the module
        run: make check-stdio

      - name: Size gate
        run: make check-size

      - name: End to end against a stub server
        run: make e2e

      - name: Package
        run: make dist DIST_TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Alpine, in a container this job starts itself rather than one the
  # runner starts for it. The runner runs every JavaScript action *inside*
  # the job container, which on musl needs the node build it ships only
  # for x64: an `alpine:3` `container:` on an arm64 runner fails at the
  # first action with "JavaScript Actions in Alpine containers are only
  # supported on x64 Linux runners". Checking out and uploading on the
  # host and running only the build under `docker run` keeps both musl
  # rows on the one path, rather than the x86_64 one on `container:` and
  # the aarch64 one on something else.
  musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-musl
            runner: ubuntu-latest
          - target: linux-aarch64-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The steps of the job above, in one container because each
      # `docker run` would otherwise start a fresh one. Root inside, as in
      # a `container:` job, which is what `make e2e` wants; the workspace
      # is the mount, so dist/ lands on the host for the upload below.
      - name: Build, gate and package
        run: |
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e INSTALL_alpine -e TARGET="${{ matrix.target }}" \
            alpine:3 sh -eux <<'EOF'
          $INSTALL_alpine
          git config --global --add safe.directory /src
          got=$(tests/dist-target.sh)
          echo "image reports: $got"
          test "$got" = "$TARGET"
          make
          make test
          make check-stdio
          make check-size
          make e2e
          make dist DIST_TARGET="$TARGET"
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # No hosted FreeBSD image exists; a VM on the Linux runner, as in
  # cross-platform.yml. Slower, but it is the OpenPAM platform that ships.
  freebsd:
    name: freebsd14-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: "14.2"
          run: |
            set -ex
            # The image's package set is older than the repo, and pkg is
            # content to install a curl built against a newer libssh2 than
            # the one already on disk -- libcurl.so.4 then fails to resolve
            # at dlopen time. Bring the image up to the repo first.
            sudo pkg upgrade -y
            sudo pkg install -y gmake pkgconf curl bash python3
            got=$(tests/dist-target.sh)
            echo "image reports: $got"
            test "$got" = freebsd14-x86_64
            gmake
            gmake test
            gmake check-stdio
            gmake check-size
            gmake tests/pamtest
            # This image boots with kern.hostname empty, so gethostname(3)
            # succeeds and returns nothing, the module sends no "hostname"
            # claim and context_check.py fails the body. Name it, as
            # cross-platform.yml does.
            sudo hostname freebsd-ci
            sudo gmake e2e
            gmake dist DIST_TARGET=freebsd14-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: dist-freebsd14-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # A hosted Mac, Apple silicon only: Apple's Intel line is at end of life,
  # and the bundle links nothing that would want a second slice. The
  # target name carries the deployment floor rather than the runner's
  # release, so this stays macos15-aarch64 when the runner label moves.
  #
  # It moved: macOS 26, building for a floor of 15 with
  # -mmacosx-version-min. The signing identities are exported from Keychain
  # Access on a macOS 26 Mac, and macOS 15 cannot read the PKCS#12 that
  # writes -- PBES2, AES-256-CBC, SHA-256 MAC -- so every rotation of those
  # certificates otherwise needs converting by hand on the way into the
  # secret store. What that costs is the module no longer being loaded on
  # the oldest release it claims: cross-platform.yml still builds and runs
  # the gates on macos-15, which is where that is checked now.
  #
  # The installer package is built here rather than in the release job,
  # because pkgbuild, productbuild, codesign and notarytool exist only on
  # macOS. The signing identities and the notary key come from 1Password
  # -- the same item the ssoossh server's quill setup reads -- through a
  # service account token in the repository secrets. Without that token
  # the package is built unsigned and the log says so, as with the GPG and
  # apk keys in the release job.
  macos:
    name: macos15-aarch64
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAVE_OP: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The image matches the target name
        run: |
          sw_vers
          got=$(tests/dist-target.sh)
          echo "image reports: $got"
          test "$got" = macos15-aarch64

      # The Ed25519 SPI the Darwin backend resolves at runtime, in this
      # SDK's export list before anything is built -- see apple-drift.yml.
      - name: Ed25519 SPI still exported by this SDK
        run: tests/apple-spi-check.sh --sdk "$(xcrun --show-sdk-path)"

      - name: Build
        run: make

      # The same gates cross-platform.yml runs.
      - name: Symbol, load and unit gates
        run: make test

      - name: Ed25519 SPI works on this macOS
        run: make check-apple-spi

      - name: No stdio in the module
        run: make check-stdio

      - name: Size gate
        run: make check-size

      # Loads the bundle by absolute path and reads the log through
      # `log stream` -- see docs/porting.md.
      - name: End to end against a stub server
        run: |
          make tests/pamtest
          sudo make e2e

      - name: Package
        run: make dist DIST_TARGET=macos15-aarch64

      # Only when the token is set, so a fork without it still gets its
      # (unsigned) package. The step's outputs are empty when it is
      # skipped, which packaging/macos.sh reads as "unsigned".
      - name: Signing material
        id: secrets
        if: ${{ env.HAVE_OP == 'true' }}
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          QUILL_SIGN_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_P12
          QUILL_SIGN_PASSWORD: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_SIGN_PASSWORD
          QUILL_NOTARY_ISSUER: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_ISSUER
          QUILL_NOTARY_KEY_ID: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY_ID
          QUILL_NOTARY_KEY: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_NOTARY_KEY
          # The package needs a "Developer ID Installer" identity as well as
          # the "Developer ID Application" one quill uses. If QUILL_SIGN_P12
          # does not hold both, put the Installer one in a second field
          # and uncomment this line and the one in the step below. A
          # reference to a field that does not exist fails the step, which
          # is why it is not simply always on.
          QUILL_INSTALLER_P12: op://Github Actions/7cyb7oo2m4hp3cmqnxeexghy2a/QUILL_INSTALLER_P12

      - name: Installer package, signed and notarized
        env:
          QUILL_SIGN_P12: ${{ steps.secrets.outputs.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ steps.secrets.outputs.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_ISSUER: ${{ steps.secrets.outputs.QUILL_NOTARY_ISSUER }}
          QUILL_NOTARY_KEY_ID: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_KEY: ${{ steps.secrets.outputs.QUILL_NOTARY_KEY }}
          QUILL_INSTALLER_P12: ${{ steps.secrets.outputs.QUILL_INSTALLER_P12 }}
        run: |
          packaging/package.sh dist/*.tar.gz dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos15-aarch64
          path: |
            dist/*.tar.gz
            dist/*.pkg
          if-no-files-found: error
          retention-days: 7

  # Everything into one place, checksummed, attested, published.
  release:
    name: release
    needs: [linux, musl, freebsd, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Each build job fails on its own if it produced no tarball, and
      # `needs` keeps this job from running unless every one succeeded,
      # so what is here is everything.
      - name: Every artifact arrived
        run: ls -l dist

      # deb, rpm and apk from the Linux tarballs; the macOS tarball is
      # passed over here, its package having been built on the Mac. nfpm is
      # pinned by version and hash; bump both together from
      # https://github.com/goreleaser/nfpm/releases.
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          curl -fsSLo nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf nfpm.tar.gz nfpm
          nfpm --version | grep GitVersion

      # Signing keys, from repository secrets, into files nfpm and gpg can
      # read. All optional: a repository without them still gets its
      # release, unsigned, and the log says so.
      #
      #   RELEASE_GPG_PRIVATE_KEY   armored OpenPGP private key; signs the
      #                             deb and rpm packages, SHA256SUMS, and
      #                             the apk -- one release key, not two.
      #                             See packaging/README.md
      #   RELEASE_GPG_PASSPHRASE    its passphrase, if any
      - name: Signing keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          APK_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          keys=$(mktemp -d)
          chmod 700 "$keys"
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$keys/gpg.asc"
            echo "PKG_GPG_KEY_FILE=$keys/gpg.asc" >> "$GITHUB_ENV"
            echo "gpg: signing with the release key"
          else
            echo "gpg: RELEASE_GPG_PRIVATE_KEY is not set; deb, rpm and SHA256SUMS will be unsigned"
          fi
          if [ -n "$APK_PRIVATE_KEY" ]; then
            printf '%s\n' "$APK_PRIVATE_KEY" > "$keys/apk.pem"
            echo "PKG_APK_KEY_FILE=$keys/apk.pem" >> "$GITHUB_ENV"
            echo "apk: signing with the release key"
          else
            echo "apk: RELEASE_GPG_PRIVATE_KEY is not set; the apk will be unsigned"
          fi
          echo "SIGNING_KEYS=$keys" >> "$GITHUB_ENV"

      - name: Packages
        env:
          PKG_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          NFPM_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          for t in dist/*.tar.gz; do
            packaging/package.sh "$t" dist
          done
          ls -l dist

      # SHA256SUMS covers everything, and the GPG signature over it covers
      # the tarballs, which have no signature of their own (the pkg carries
      # Apple's, and is listed so one file names every artifact). The public key
      # is published beside it so a first-time verifier has something to
      # import; its fingerprint belongs in the README too, so the release
      # is not the only place the key is vouched for.
      - name: Checksums and signature
        env:
          NFPM_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          cd dist
          sha256sum -- *.tar.gz *.deb *.rpm *.apk *.pkg | tee SHA256SUMS
          if [ -n "${PKG_GPG_KEY_FILE:-}" ]; then
            export GNUPGHOME="$SIGNING_KEYS/gnupg"
            mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
            gpg --batch --import "$PKG_GPG_KEY_FILE"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$NFPM_PASSPHRASE" --armor --detach-sign SHA256SUMS
            gpg --batch --armor --export > pam-ssoossh-release-key.asc
            gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          fi
          if [ -n "${PKG_APK_KEY_FILE:-}" ]; then
            openssl rsa -in "$PKG_APK_KEY_FILE" -pubout -out pam-ssoossh.rsa.pub
          fi
          ls -l

      # Build provenance, verifiable with `gh attestation verify`. Only for
      # a repository where GitHub offers it -- public, or private under
      # enterprise -- so a private repository still gets its release.
      - name: Attest provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg

      - name: Publish the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          # shellcheck disable=SC2086  # $pre is deliberately empty or one flag
          gh release create "$GITHUB_REF_NAME" $pre \
            --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.apk dist/*.pkg \
            dist/SHA256SUMS* dist/*.asc dist/*.pub

      # On a manual run there is no tag and no release: the merged set is
      # kept as a workflow artifact for inspection instead.
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_type != 'tag' }}
        with:
          name: release-dry-run
          path: dist/*
          retention-days: 7
